name: Deploy DevLens to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: devlens-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify and build
        run: |
          npm run typecheck
          npm test
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test live production routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /collections /environments /history /tools; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "https://devlens.cc.cd$path" -o /dev/null
          done
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://devlens.cc.cd/ -o /tmp/devlens-live.html
          grep -qi "<title>DevLens" /tmp/devlens-live.html
